---
- name: Install packages from URL (dnf)
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
    disable_gpg_check: true
  loop: "{{ packages_url }}"
  when: packages_url | length > 0
  become: true

- name: Install packages (dnf)
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop: "{{ packages }}"
  when: packages | length > 0
  become: true

- name: Replace packages (dnf)
  ansible.builtin.dnf:
    name: "{{ item.new }}"
    state: present
    allowerasing: true
  loop: "{{ packages_replace }}"
  when: packages_replace | length > 0
  become: true
