---
- name: Fedora personal setup
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    system: fedora
    profile: personal
    machine_id: "{{ machine_name | default(ansible_hostname, true) }}"

    layers:
      - name: system
        dir: system
        file: "{{ system }}"
      - name: profile
        dir: profile
        file: "{{ system }}-{{ profile }}"
      - name: machine
        dir: machines
        file: "{{ machine_id }}"

  pre_tasks:
    - name: Apply the system, profile and machine layers
      ansible.builtin.include_tasks: tasks/apply-layer.yml
      loop: "{{ layers }}"
      vars:
        layer_name: "{{ item.name }}_layer"
        layer_dir: "{{ item.dir }}"
        layer_file: "{{ item.file }}"

  roles:
    - role: installer
