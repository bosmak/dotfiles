---
- name: Fedora personal setup
  hosts: localhost
  connection: local
  gather_facts: true

  roles:
    - role: installer
      vars:
        extra_repos:
          - jdxcode/mise
          - atim/starship
          - bosmak/copr
        pre_packages:
          - rpmfusion-free-release
          - rpmfusion-nonfree-release
          - python3-dnf-plugin-versionlock
          - curl
        pre_install_commands:
          - command: "curl -fsSL https://yum.enpass.io/enpass-yum.repo -o /etc/yum.repos.d/enpass-yum.repo"
            creates: /etc/yum.repos.d/enpass-yum.repo
            become: true
        packages:
          - firefox
          - vim
          - wget
          - power-profiles-daemon
          - cups-pk-helper
          - kf6-kimageformats
          - i2c-tools
          - adw-gtk3-theme
          - qt6ct
          - qt5ct
          - xdg-user-dirs
          - xdg-utils
          - flatpak
          - flatseal
          - zsh
          - ripgrep
          - steam
          - steam-devices
          - gamemode
          - ibus
          - ibus-gtk2
          - ibus-gtk3
          - ibus-gtk4
          - ibus-panel
          - ibus-setup
          - ibus-wayland
          - ibus-m17n
          - mise
          - starship
          - wl-clipboard
          - xclip
          - cups
          - cups-filters
          - cups-pk-helper
          - xwayland-satellite-0.8.1-1.fc44
          - pvpn
          - clip-bridge
          - liberation-fonts-all
          - rsms-inter-vf-fonts
          - fira-code-fonts
          - levien-inconsolata-fonts
          - google-noto-fonts-all
          - xorg-x11-font-utils
          - fontconfig
          - enpass
          - dux-files
          - steam-fix-trayicon
          - iwlwifi-mvm-firmware
          - iwlbluetooth-firmware
          - wireless-regdb
          - NetworkManager-wifi
          - wpa_supplicant
          - NetworkManager-bluetooth
          - fprintd
          - fprintd-pam
          - pam-u2f
          - podman
          - podman-compose
        flatpak_repos:
          - name: flathub
            url: https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak:
          - com.discordapp.Discord
          - org.freecad.FreeCAD
          - com.heroicgameslauncher.hgl
          - org.freedesktop.Platform.VulkanLayer.gamescope//25.08
          - com.vysp3r.ProtonPlus
          - com.bitwarden.desktop
          - org.gtk.Gtk3theme.adw-gtk3
          - org.gtk.Gtk3theme.adw-gtk3-dark
          - me.amankhanna.opendeck
          - org.angryip.ipscan
          - app.zen_browser.zen
          - com.orcaslicer.OrcaSlicer
          - app.ytmdesktop.ytmdesktop
          - org.videolan.VLC
          - com.ktechpit.whatsie
          - org.gnome.Calculator
          - dev.zed.Zed
          - org.gnome.Firmware
          - io.github.flattool.Ignition
        packages_replace:
          - old: ffmpeg-free
            new: ffmpeg
        locked_packages:
          - name: xwayland-satellite
            version: "0.8.1-1.fc44"
            reason: "0.8.2 regresses Steam's X11 override-redirect popups under niri (Supreeeme/xwayland-satellite#468); 0.8.1-1 is the last release that works"
        github_repositories:
          - name: zap
            repository: zap-zsh/zap
            dest: "{{ ansible_env.HOME }}/.local/share/zap"
            depth: 1
            update: false
        keyboard:
          layout: us
          model: pc105
          variant: alt-intl
          options: []
          ibus_engine: xkb:us:alt-intl:eng
        user_groups:
          - i2c
          - pvpn
        post_install_commands:
          - command: mise trust
            chdir: "{{ ansible_env.HOME }}"
          - command: mise install --yes
            chdir: "{{ ansible_env.HOME }}"
          - command: >
              for id in calculator wallhavenCarousel niriWorkspaceBar caffeineRedesigned;
              do dms plugins install "$id";
              rc=$?;
              [ $rc -eq 0 ] || [ $rc -eq 1 ] || echo "id=$id failed (rc=$rc)";
              done
            chdir: "{{ ansible_env.HOME }}"
